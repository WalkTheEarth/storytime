name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # Includes the live integration test (test/integration_test.dart) that
      # verifies all four novel sources end-to-end against their production
      # APIs with the story codes in TEST STORY CODES ALL APPS.txt.
      - name: Unit & integration tests
        run: flutter test

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storytime-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # On version tags (v*), also attach the APK to a GitHub Release.
      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/build/app/outputs/flutter-apk/app-release.apk
