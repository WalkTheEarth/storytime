name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    # The Flutter project lives in client/.
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test test/widget_test.dart

      # Live end-to-end check of all four novel sources against their
      # production APIs using the story codes in TEST STORY CODES ALL APPS.txt.
      - name: Live integration tests
        run: flutter test test/integration_test.dart

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    # Needed by softprops/action-gh-release to create the GitHub Release
    # (the default GITHUB_TOKEN is read-only on new repos).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build APK
        working-directory: client
        run: flutter build apk --release

      # The app does nothing without network access — fail the build if the
      # INTERNET permission ever drops out of the release manifest.
      - name: Verify APK has INTERNET permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump permissions client/build/app/outputs/flutter-apk/app-release.apk \
            | tee /tmp/perms.txt
          grep -q 'android.permission.INTERNET' /tmp/perms.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storytime-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # On version tags (v*), also attach the APK to a GitHub Release.
      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/build/app/outputs/flutter-apk/app-release.apk
