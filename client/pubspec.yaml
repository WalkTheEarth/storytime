name: storytime
description: FOSS multi-source novel reader. Reads from Novel Master, PlotNovel, MotoNovel and GoodNovel.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  pointycastle: ^3.9.1
  asn1lib: ^1.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
